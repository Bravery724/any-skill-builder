<!doctype html>
<html lang="{{locale.language}}" dir="{{locale.direction}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <!--UI_FINGERPRINT-->
  <link rel="icon" href="data:,">
  <title>{{t:page_title}}</title>
  <!--INLINE_CSS-->
</head>
<body>
<main id="form-main" data-load-error="{{t:load_failed}}" data-regenerate="{{t:regenerate}}">
  <header class="goal-summary" id="goal-summary">
    <p class="goal-label">{{t:goal_label}}</p>
    <h1 id="goal-text"></h1>
    <button type="button" class="text-button" id="goal-toggle" aria-expanded="false" aria-controls="goal-text" hidden>{{t:goal_expand}}</button>
    <p class="intro">{{t:answer_intro}}</p>
  </header>
  <form id="questionnaire" novalidate>
    <div class="overview"><span id="counts" aria-live="polite" aria-atomic="true">{{t:loading}}</span><span id="section-label"></span></div>
    <p id="conditional-status" class="conditional-status" hidden></p>
    <div id="questions"></div>
    <nav class="navigation" aria-label="{{t:page_select}}">
      <button type="button" class="button" id="previous" disabled>{{t:previous}}</button>
      <select id="page-select" aria-label="{{t:page_select}}"></select>
      <button type="button" class="button" id="next" disabled>{{t:next}}</button>
    </nav>
    <div class="reset-row"><button type="button" class="text-button" id="reset-all">{{t:reset_all_answers}}</button></div>
  </form>
  <p class="notice" id="notice" role="status"></p>
  <noscript><p class="notice">{{t:javascript_required}}</p></noscript>
</main>
<footer class="savebar">
  <div class="save-inner">
    <div><p class="save-heading">{{t:blank_guidance}}</p><p class="save-caption" id="save-state" role="status">{{t:save_guidance}}</p></div>
    <button type="button" class="button primary" id="save-answers" disabled>{{t:save_answers}}</button>
  </div>
</footer>
<dialog class="dialog" id="save-dialog" aria-labelledby="save-title">
  <h2 id="save-title">{{t:save_title}}</h2>
  <p id="save-message"></p>
  <p id="save-summary"></p>
  <p class="chat-phrase">{{t:resume_message}}</p>
  <p class="small">{{t:save_location}}</p>
  <div class="dialog-actions"><button type="button" class="button primary" id="close-save">{{t:return_questionnaire}}</button></div>
</dialog>
<dialog class="dialog" id="reset-dialog" aria-labelledby="reset-title">
  <h2 id="reset-title">{{t:reset_confirm_message}}</h2>
  <p>{{t:reset_explanation}}</p>
  <div class="dialog-actions"><button type="button" class="button" id="cancel-reset">{{t:reset_cancel}}</button><button type="button" class="button primary" id="confirm-reset">{{t:reset_confirm}}</button></div>
</dialog>
<dialog id="image-dialog" aria-label="{{t:image_dialog}}"><div class="dialog-bar"><span id="image-caption"></span><button type="button" class="button" id="close-image">{{t:close}}</button></div><img id="enlarged-image" alt=""></dialog>
<!--BOOT_JSON-->
<!--INLINE_JS-->
</body>
</html>
